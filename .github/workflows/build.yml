name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        gnat: [^10, ^11, ^12, ^13, ^14, ^15, ""]
        # "" ensures that even if we miss some version, we test with the latest
        # one from Alire.
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: alire-project/setup-alire@v6
      with:
        version: 2.1.1
        toolchain: gnat_native${{ matrix.gnat }} gprbuild

    # - name: Prepare pin
    #   run: |
    #     git clone https://github.com/mosteo/yeison --branch main
    #     alr pin yeison_12 --use=yeison/yeison_12
    #     alr -C test/ pin yeison_12 --use=../yeison/yeison_12

    - name: Build library
      run: alr build

    - name: Run tests
      run: alr -C test/ run

    # New testsuite

    - uses: alire-project/setup-alire@v6
      with:
        version: nightly
        toolchain: gnat_native${{ matrix.gnat }} gprbuild

    - name: Run new tests
      run: alr test

