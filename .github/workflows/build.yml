name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # GNAT 10 and 11 crash (ICE) compiling the adayaml dependency,
        # so the supported floor is GNAT 12.
        gnat: [^12, ^13, ^14, ^15, ""]
        # "" ensures that even if we miss some version, we test with the latest
        # one from Alire.
        exclude:
          - os: macos-latest
            gnat: ^12 # No gnat 12 toolchain for macos
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: alire-project/setup-alire@v6
      with:
        version: nightly
        msys2: false # Windows fails otherwise because C: in tar
        toolchain: gnat_native${{ matrix.gnat }} gprbuild

    - name: Use system ld (old bundled binutils vs modern glibc)
      if: runner.os == 'Linux'
      run: |
        # GNAT <= 11 toolchains bundle binutils < 2.38, which cannot
        # read the .relr.dyn section of glibc >= 2.36 (ubuntu >= 24.04).
        # The system linker works fine with old gcc, so use it instead.
        # /usr/bin/ld is hardcoded because the toolchain's own ld may
        # shadow it on PATH.
        for ld in ~/.local/share/alire/toolchains/gnat_native_*/*/bin/ld
        do
          ln -sf /usr/bin/ld "$ld"
        done

    - name: Build library
      run: alr build

    - name: Run tests
      run: alr -C test/ run

    # New testsuite

    - name: Run new tests
      run: alr test

